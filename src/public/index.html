<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QAOps Tarefas</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div>
    <h1>QAOps Tarefas</h1>
    <p>Gerenciador de tarefas standalone &mdash; trabalho pratico DevOps/QAOps</p>
  </div>
  <div class="user-bar">
    <span id="current-user"></span>
    <button id="manage-users-btn" type="button" hidden>Usuarios</button>
    <button id="logout-btn" type="button">Sair</button>
  </div>
</header>

<main>
  <form id="new-task-form" class="new-task-form">
    <input type="text" id="title" placeholder="Titulo da tarefa" required maxlength="200" />
    <input type="text" id="assignee" placeholder="Responsavel (opcional)" />
    <select id="priority">
      <option value="low">Baixa</option>
      <option value="medium" selected>Media</option>
      <option value="high">Alta</option>
    </select>
    <input type="date" id="due_date" />
    <button type="submit">Adicionar tarefa</button>
  </form>

  <div class="board">
    <section class="column" data-status="todo">
      <h2>A fazer</h2>
      <div class="cards" id="col-todo"></div>
    </section>
    <section class="column" data-status="doing">
      <h2>Em andamento</h2>
      <div class="cards" id="col-doing"></div>
    </section>
    <section class="column" data-status="done">
      <h2>Concluido</h2>
      <div class="cards" id="col-done"></div>
    </section>
  </div>
</main>

<dialog id="users-dialog">
  <h2>Usuarios</h2>
  <form id="new-user-form">
    <input type="text" id="new-username" placeholder="Usuario" required maxlength="50" />
    <input type="password" id="new-password" placeholder="Senha (min. 6 caracteres)" required minlength="6" />
    <select id="new-role">
      <option value="comum" selected>Comum</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit">Criar usuario</button>
    <p id="new-user-error" class="error" hidden></p>
  </form>
  <ul id="users-list"></ul>
  <button id="close-users-dialog" type="button">Fechar</button>
</dialog>

<script src="app.js"></script>
</body>
</html>
