<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QAOps Tarefas</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="app-body">
<header class="topbar">
  <div class="brand">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    </span>
    <span class="brand-name">QAOps Tarefas</span>
  </div>
  <div class="user-bar">
    <button id="manage-users-btn" class="btn btn-ghost btn-sm" type="button" hidden>Usuários</button>
    <span class="user-chip">
      <span class="avatar" id="current-user-avatar"></span>
      <span id="current-user"></span>
    </span>
    <button id="logout-btn" class="btn btn-ghost btn-sm" type="button">Sair</button>
  </div>
</header>

<section class="page-header">
  <div class="page-title">
    <span class="page-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zm-4 6h2v2H3zm4 0h14v2H7z"/></svg>
    </span>
    <h1>Gestão de Tarefas</h1>
  </div>
  <button id="new-task-btn" class="btn btn-primary" type="button">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    Nova Tarefa
  </button>
</section>

<section class="summary" aria-label="Resumo das tarefas">
  <div class="stat"><span class="stat-label">Total</span><span class="stat-value" id="stat-total">0</span></div>
  <div class="stat"><span class="stat-label">Concluídas</span><span class="stat-value" id="stat-done-pct">0%</span></div>
  <div class="stat stat-alert" id="stat-overdue-box">
    <span class="stat-label">
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22zm1 15h-2v-2h2zm0-4h-2V9h2z"/></svg>
      Atrasadas
    </span>
    <span class="stat-value" id="stat-overdue">0</span>
  </div>
  <div class="stat stat-wide">
    <span class="stat-label">Distribuição por status</span>
    <div class="dist-bar" id="dist-bar" role="img" aria-label="Distribuição por status"></div>
    <ul class="dist-legend" id="dist-legend"></ul>
  </div>
  <div class="dist-tooltip" id="dist-tooltip" hidden></div>
</section>

<div class="search-wrap">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.39-1.42 1.42-5.39-5.39A8 8 0 1 1 10 2m0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12"/></svg>
  <input type="search" id="search" placeholder="Pesquisar por título..." autocomplete="off" />
</div>

<main class="board">
  <section class="column col-todo" data-status="todo">
    <header class="column-header">
      <span class="dot"></span><h2>A Fazer</h2><span class="count" id="count-todo">0</span>
    </header>
    <div class="cards" id="col-todo"></div>
  </section>
  <section class="column col-doing" data-status="doing">
    <header class="column-header">
      <span class="dot"></span><h2>Em Andamento</h2><span class="count" id="count-doing">0</span>
    </header>
    <div class="cards" id="col-doing"></div>
  </section>
  <section class="column col-done" data-status="done">
    <header class="column-header">
      <span class="dot"></span><h2>Concluído</h2><span class="count" id="count-done">0</span>
    </header>
    <div class="cards" id="col-done"></div>
  </section>
</main>

<dialog id="task-dialog" class="modal">
  <form id="task-form" method="dialog" novalidate>
    <header class="modal-header">
      <span class="page-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 3h-4.18A3 3 0 0 0 12 1a3 3 0 0 0-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2m-2 14-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9z"/></svg>
      </span>
      <div>
        <h2 id="task-dialog-title">Nova tarefa</h2>
        <p class="muted" id="task-dialog-subtitle">Preencha os campos e crie a tarefa.</p>
      </div>
      <button type="button" class="icon-btn" id="task-dialog-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </header>

    <div class="modal-body">
      <label for="task-title">Título <span class="req">*</span></label>
      <input type="text" id="task-title" maxlength="200" placeholder="Ex: Revisar campanha comercial" />

      <label for="task-description">Descrição</label>
      <textarea id="task-description" rows="4" placeholder="Detalhes opcionais..."></textarea>

      <label for="task-due-date">Prazo</label>
      <div class="row">
        <input type="date" id="task-due-date" class="grow" />
        <input type="time" id="task-due-time" />
      </div>

      <div class="row">
        <div class="grow">
          <label for="task-priority">Prioridade</label>
          <select id="task-priority">
            <option value="low">Baixa</option>
            <option value="medium" selected>Média</option>
            <option value="high">Alta</option>
          </select>
        </div>
        <div class="grow" id="task-status-field" hidden>
          <label for="task-status">Status</label>
          <select id="task-status">
            <option value="todo">A Fazer</option>
            <option value="doing">Em Andamento</option>
            <option value="done">Concluído</option>
          </select>
        </div>
      </div>

      <label for="task-assignee">Responsável</label>
      <input type="text" id="task-assignee" list="assignee-options" placeholder="Nome do responsável" />
      <datalist id="assignee-options"></datalist>

      <p id="task-error" class="error" hidden></p>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn btn-danger-ghost" id="task-delete-btn" hidden>Excluir</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="task-cancel-btn">Cancelar</button>
      <button type="submit" class="btn btn-primary" id="task-submit-btn">Criar tarefa</button>
    </footer>
  </form>
</dialog>

<dialog id="users-dialog" class="modal modal-sm">
  <header class="modal-header">
    <div><h2>Usuários</h2></div>
    <button id="close-users-dialog" type="button" class="icon-btn" aria-label="Fechar">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </header>
  <div class="modal-body">
    <form id="new-user-form">
      <input type="text" id="new-username" placeholder="Usuário" required maxlength="50" />
      <input type="password" id="new-password" placeholder="Senha (mín. 6 caracteres)" required minlength="6" />
      <select id="new-role">
        <option value="comum" selected>Comum</option>
        <option value="admin">Admin</option>
      </select>
      <button type="submit" class="btn btn-primary">Criar usuário</button>
      <p id="new-user-error" class="error" hidden></p>
    </form>
    <ul id="users-list"></ul>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
