<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Criar conta — QAOps Tarefas</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
<main class="login-card">
  <h1>Criar conta</h1>
  <p class="muted">Cria um usuario comum, com acesso somente as suas proprias tarefas.</p>

  <form id="register-form">
    <label for="username">Usuario</label>
    <input type="text" id="username" name="username" autocomplete="username" maxlength="50" required />

    <label for="password">Senha</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required />

    <label for="confirm-password">Confirmar senha</label>
    <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" minlength="6" required />

    <button type="submit">Criar conta</button>
    <p id="register-error" class="error" hidden></p>
  </form>

  <p class="muted"><a href="login.html">Ja tenho conta</a></p>
</main>

<script src="register.js"></script>
</body>
</html>
