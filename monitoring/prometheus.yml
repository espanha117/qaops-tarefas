global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Metricas da aplicacao (requisicoes, latencia, erros por status)
  - job_name: qaops-app
    static_configs:
      - targets: ['app:9464']

  # Metricas da VM (CPU, memoria, disco)
  - job_name: vm
    static_configs:
      - targets: ['node-exporter:9100']
